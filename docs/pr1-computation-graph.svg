<svg width="680" height="350" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Computation graph for d = a * b + c</title>
  <desc>Three input values flow forward through multiply and add to produce d. Each node also shows its grad, computed by walking the graph backward from d.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="350" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="50" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="115" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">a = 2.0</text>
    <text x="115" y="83" text-anchor="middle" font-size="12" fill="#0F6E56">grad = &#8722;3.0</text>
    <rect x="50" y="130" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="115" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">b = &#8722;3.0</text>
    <text x="115" y="173" text-anchor="middle" font-size="12" fill="#0F6E56">grad = 2.0</text>
    <rect x="50" y="220" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="115" y="243" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">c = 10.0</text>
    <text x="115" y="263" text-anchor="middle" font-size="12" fill="#0F6E56">grad = 1.0</text>
    <rect x="280" y="85" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="355" y="108" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">a &#215; b = &#8722;6.0</text>
    <text x="355" y="128" text-anchor="middle" font-size="12" fill="#5F5E5A">grad = 1.0</text>
    <rect x="510" y="150" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="575" y="173" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">d = 4.0</text>
    <text x="575" y="193" text-anchor="middle" font-size="12" fill="#534AB7">the output</text>
    <line x1="182" y1="68" x2="276" y2="104" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="182" y1="158" x2="276" y2="122" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="432" y1="113" x2="506" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="182" y1="248" x2="506" y2="186" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="115" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">values flow forward &#8594;</text>
    <text x="500" y="322" text-anchor="middle" font-size="12" fill="#5F5E5A">&#8592; grads are filled in backward, from d</text>
  </g>
</svg>
