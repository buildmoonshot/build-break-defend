<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Attention: the letter a looks back over .emma with learned weights</title>
  <desc>From the final a in .emma, lines reach back to each earlier token with different thicknesses and percentages; the next-letter guess is made from that weighted blend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="280" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M 446 168 V 140 H 386 V 162" fill="none" stroke="#7F77DD" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text x="416" y="132" text-anchor="middle" font-size="12" fill="#534AB7">37%</text>
    <path d="M 450 168 V 110 H 310 V 162" fill="none" stroke="#7F77DD" stroke-width="2.4" marker-end="url(#arrow)"/>
    <text x="380" y="102" text-anchor="middle" font-size="12" fill="#534AB7">18%</text>
    <path d="M 458 168 V 80 H 234 V 162" fill="none" stroke="#7F77DD" stroke-width="1.7" marker-end="url(#arrow)"/>
    <text x="346" y="72" text-anchor="middle" font-size="12" fill="#534AB7">17%</text>
    <path d="M 462 168 V 50 H 158 V 162" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="310" y="42" text-anchor="middle" font-size="12" fill="#534AB7">6%</text>
    <rect x="128" y="170" width="60" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <rect x="204" y="170" width="60" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <rect x="280" y="170" width="60" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <rect x="356" y="170" width="60" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="158" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">.</text>
    <text x="234" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">e</text>
    <text x="310" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">m</text>
    <text x="386" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">m</text>
    <rect x="432" y="170" width="60" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="462" y="192" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">a</text>
    <rect x="532" y="170" width="76" height="44" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="570" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">next?</text>
    <line x1="494" y1="192" x2="528" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowg)"/>
    <text x="340" y="252" text-anchor="middle" font-size="12" fill="#5F5E5A">before guessing, &#8220;a&#8221; looks back at everything and weighs what matters &#8212; the guess is made from that blend</text>
  </g>
</svg>
