<svg width="680" height="180" viewBox="0 0 680 180" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The training loop</title>
  <desc>Predict, measure loss, backward to assign blame, nudge every knob downhill; repeat until the loss is small.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="180" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="40" y="40" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="107" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Predict</text>
    <text x="107" y="83" text-anchor="middle" font-size="12" fill="#0F6E56">forward pass</text>
    <line x1="177" y1="68" x2="189" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="193" y="40" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="260" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#085041">Measure loss</text>
    <text x="260" y="83" text-anchor="middle" font-size="12" fill="#0F6E56">how wrong?</text>
    <line x1="330" y1="68" x2="342" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="346" y="40" width="135" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="413" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Backward</text>
    <text x="413" y="83" text-anchor="middle" font-size="12" fill="#993C1D">assign blame</text>
    <line x1="483" y1="68" x2="495" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="499" y="40" width="135" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <text x="566" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#712B13">Nudge knobs</text>
    <text x="566" y="83" text-anchor="middle" font-size="12" fill="#993C1D">step downhill</text>
    <text x="340" y="140" text-anchor="middle" font-size="12" fill="#5F5E5A">&#8635; repeat hundreds of times, until the loss is small &#8212; that is all &#8220;training&#8221; means</text>
  </g>
</svg>
